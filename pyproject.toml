[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metology-worker"
version = "0.1.0"
description = "PostgreSQL/S3 worker with a persistent FaceLift processor"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2.10,<3.3",
    "boto3>=1.35,<2",
    "python-dotenv>=1.0,<2",
    "Pillow==10.4.0",
    "pillow-heif==0.18.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.12,<0.13"]

[project.scripts]
metology-worker = "metology_worker.__main__:main"

[tool.setuptools.packages.find]
include = ["metology_worker*"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
